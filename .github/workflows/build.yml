name: Build MOI SUBFRAME (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unit test of the pure C++ journal logic (no Geode needed).
      - name: Journal unit test
        run: g++ -std=c++20 -Wall -Wextra -o /tmp/jt tests/journal_test.cpp && /tmp/jt

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: Android64

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
